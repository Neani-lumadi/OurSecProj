<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register / Contact Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-page">
    <!-- Navigation -->
    <div class="form-nav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact Us</a>
      <a href="about.html">About Us</a>
    </div>

    <!-- Form Card -->
    <div class="form-container">
      <h1>Get in Touch</h1>
      <p>Please fill in your details below and we’ll get back to you.</p>

      <form id="contactForm">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname" placeholder="Enter your first name" required>

        <label for="lname">Surname</label>
        <input type="text" id="lname" name="lname" placeholder="Enter your surname" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault(); 
      alert("Thank you for writing to us, we will contact you in 24 to 48 hours");
      this.reset(); 
    });
  </script>
</body>
</html>
